<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Aegis AI</title>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; margin: 0; padding: 20px; width: 300px; background: #F6F5F2; color: #111; }
    h1 { font-size: 1.2rem; margin: 0 0 6px; color: #FF5A1F; }
    p { font-size: 0.85rem; color: #555; margin: 0 0 14px; }
    textarea { width: 100%; min-height: 90px; border: 1.5px solid #ddd; border-radius: 10px; padding: 10px; font-size: 0.85rem; font-family: inherit; resize: vertical; box-sizing: border-box; }
    button { margin-top: 10px; width: 100%; padding: 10px; background: #FF5A1F; color: white; border: none; border-radius: 999px; font-weight: 700; cursor: pointer; }
    button:hover { background: #ff6a2f; }
    #result { margin-top: 14px; font-size: 0.85rem; }
    .pill { display: inline-block; padding: 4px 10px; border-radius: 999px; font-weight: 700; font-size: 0.75rem; margin-bottom: 6px; }
    .d { background: #FEE2E2; color: #B91C1C; }
    .s { background: #FEF3C7; color: #B45309; }
    .ok { background: #DCFCE7; color: #15803D; }
  </style>
</head>
<body>
  <h1>Aegis AI</h1>
  <p>Paste a message, email, or URL to scan.</p>
  <textarea id="t" placeholder="Paste suspicious content…"></textarea>
  <button id="go">Scan with Gemini</button>
  <div id="result"></div>
  <script src="popup.js"></script>
</body>
</html>
